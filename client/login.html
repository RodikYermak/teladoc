<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Teladoc Login</title>
        <style>
            * {
                box-sizing: border-box;
                font-family: Arial, Helvetica, sans-serif;
            }

            body {
                margin: 0;
                background-color: #f5f5f7;
                color: #333;
            }

            .header {
                padding: 20px 40px;
                border-bottom: 1px solid #ddd;
                background: #fff;
            }

            .logo {
                font-size: 26px;
                font-weight: bold;
                color: #5a3ea6;
            }

            .logo span {
                display: block;
                font-size: 12px;
                color: #00a3ad;
                letter-spacing: 1px;
                margin-top: 2px;
            }

            .container {
                max-width: 500px;
                margin: 80px auto;
                background: transparent;
                text-align: center;
            }

            h1 {
                font-size: 28px;
                margin-bottom: 40px;
                font-weight: 700;
            }

            .form-group {
                text-align: left;
                margin-bottom: 20px;
            }

            label {
                display: block;
                margin-bottom: 8px;
                font-size: 14px;
                font-weight: 500;
            }

            input {
                width: 100%;
                padding: 12px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 14px;
            }

            input:focus {
                outline: none;
                border-color: #5a3ea6;
            }

            .forgot {
                font-size: 13px;
                margin: 10px 0 25px;
                text-align: right;
            }

            .forgot a {
                color: #3b6edc;
                text-decoration: none;
            }

            .forgot a:hover {
                text-decoration: underline;
            }

            .btn {
                width: 100%;
                background-color: #5a3ea6;
                color: #fff;
                border: none;
                padding: 14px;
                border-radius: 8px;
                font-size: 16px;
                cursor: pointer;
                font-weight: 600;
            }

            .btn:hover {
                background-color: #4a3390;
            }

            .create-account {
                margin-top: 20px;
                font-size: 14px;
            }

            .create-account a {
                color: #3b6edc;
                text-decoration: none;
                font-weight: 500;
            }

            .create-account a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div class="logo">
                Teladoc
                <span>HEALTH</span>
            </div>
        </div>

        <div class="container">
            <h1>Sign in to your account</h1>

            <div class="form-group">
                <label>Username or email</label>
                <input type="text" />
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" />
            </div>

            <div class="forgot">Forgot <a href="#">username</a> or <a href="#">password?</a></div>

            <button class="btn">Sign In</button>

            <div class="create-account">
                <a href="#">Create a new account</a>
            </div>
        </div>
    </body>
</html>
