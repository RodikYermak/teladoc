<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tenant Dashboard – Teladoc Health</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:    #00a3ad;
      --purple:  #4b2d8f;
      --purple-mid: #5c3ea5;
      --purple-light: #ede8f8;
      --border:  #d9d9d9;
      --bg:      #e8e8e8;
      --white:   #ffffff;
      --text:    #1a1a1a;
      --muted:   #6b7280;
      --input-ph:#9ca3af;
      --nav-h:   72px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── NAV ────────────────────────────────────────────── */
    nav {
      height: var(--nav-h);
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
    }

    .logo {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }
    .logo-teladoc {
      font-size: 22px;
      font-weight: 700;
      color: var(--purple);
      letter-spacing: -0.5px;
    }
    .logo-teladoc span { color: var(--teal); }
    .logo-health {
      font-size: 10px;
      font-weight: 600;
      color: var(--teal);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 1px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .nav-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }
    .nav-admin {
      font-size: 15px;
      font-weight: 600;
      color: var(--purple-mid);
      text-decoration: none;
      cursor: pointer;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--purple-mid);
      color: var(--white);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── MAIN LAYOUT ─────────────────────────────────────── */
    .page {
      display: flex;
      justify-content: center;
      padding: 48px 40px;
      position: relative;
    }

    /* ── TABLE (background, blurred) ─────────────────────── */
    .table-wrap {
      width: 100%;
      max-width: 900px;
      background: var(--white);
      border-radius: 4px;
      overflow: hidden;
      filter: blur(1px);
      opacity: 0.5;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    thead tr {
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }
    thead th {
      padding: 14px 24px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
    }
    tbody tr:last-child { border-bottom: none; }
    tbody td {
      padding: 16px 24px;
      font-size: 14px;
      color: var(--text);
    }
    .edit-btn {
      border: 1px solid var(--border);
      background: var(--white);
      padding: 5px 18px;
      font-size: 13px;
      font-family: inherit;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text);
    }
    .edit-btn:hover { background: var(--purple-light); }

    /* ── MODAL OVERLAY ───────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    /* ── MODAL ───────────────────────────────────────────── */
    .modal {
      background: var(--white);
      border-radius: 16px;
      padding: 40px 44px 40px;
      width: 440px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.14);
      animation: pop 0.2s ease;
    }
    @keyframes pop {
      from { transform: scale(0.95); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .modal h2 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: var(--white);
      transition: border-color 0.15s;
    }
    .field input::placeholder {
      color: var(--input-ph);
    }
    .field input:focus {
      border-color: var(--purple-mid);
    }
    .field input[readonly] {
      background: #fafafa;
      cursor: default;
    }

    /* ── ACTIONS ─────────────────────────────────────────── */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 32px;
    }
    .btn-discard {
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      color: var(--purple-mid);
      background: var(--white);
      border: 2px solid var(--purple-mid);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn-discard:hover {
      background: var(--purple-light);
    }
    .btn-update {
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      color: var(--white);
      background: var(--purple-mid);
      border: 2px solid var(--purple-mid);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-update:hover {
      background: var(--purple);
      border-color: var(--purple);
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="logo">
      <div class="logo-teladoc">Telado<span>c.</span></div>
      <div class="logo-health">Health</div>
    </div>
    <div class="nav-right">
      <span class="nav-title">Tenant Dashboard</span>
      <a class="nav-admin">Admin View</a>
      <div class="avatar">A</div>
    </div>
  </nav>

  <!-- PAGE -->
  <div class="page">

    <!-- Background table (blurred) -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tenant</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>tenant@email.com</td>
            <td style="text-align:right; padding-right:24px;"><button class="edit-btn">Edit</button></td>
          </tr>
          <tr>
            <td>tenant@email.com</td>
            <td style="text-align:right; padding-right:24px;"><button class="edit-btn">Edit</button></td>
          </tr>
          <tr>
            <td>tenant@email.com</td>
            <td style="text-align:right; padding-right:24px;"><button class="edit-btn">Edit</button></td>
          </tr>
          <tr>
            <td>tenant@email.com</td>
            <td style="text-align:right; padding-right:24px;"><button class="edit-btn">Edit</button></td>
          </tr>
          <tr>
            <td>tenant@email.com</td>
            <td style="text-align:right; padding-right:24px;"><button class="edit-btn">Edit</button></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Modal overlay -->
    <div class="overlay">
      <div class="modal">
        <h2>Edit Quota</h2>

        <div class="field">
          <label>Tenant</label>
          <input type="text" value="tenant@email.com" readonly />
        </div>

        <div class="field">
          <label>Current Quota</label>
          <input type="text" value="1,000,000" readonly />
        </div>

        <div class="field">
          <label>New Quota</label>
          <input type="text" placeholder="1,000,000" />
        </div>

        <div class="field">
          <label>Reason</label>
          <input type="text" placeholder="up to 8 characters" maxlength="8" />
        </div>

        <div class="actions">
          <button class="btn-discard">Discard</button>
          <button class="btn-update">Update</button>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
