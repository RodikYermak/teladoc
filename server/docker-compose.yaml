services:
    db:
        image: postgres:15
        restart: unless-stopped
        environment:
            POSTGRES_DB: teladoc
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
    test-db:
        image: postgres:15
        restart: unless-stopped
        environment:
            POSTGRES_DB: teladoc_test
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '5433:5432'
    web:
        build: .
        command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
        env_file:
            - .env
        ports:
            - '8000:8000'
        depends_on:
            - db
        volumes:
            - .:/app

volumes:
    postgres_data:
